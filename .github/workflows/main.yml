name: AL-Mastur WhatsApp Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Taaki tum manually bhi run kar sako

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Start AI Bot with Auto-Restart Loop
      run: |
        echo "🚀 Starting AL-Mastur Bot..."
        while true; do
          npm start
          echo "🔄 Bot crashed or stopped, restarting in 5 seconds..."
          sleep 5
        done
